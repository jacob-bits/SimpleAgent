name: CI

# 触发时机：main 推送、所有 PR、以及手动触发
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# GITHUB_TOKEN 默认权限收紧为只读：CI 只需要读代码
permissions:
  contents: read

# 同一分支连续推送时，取消上一次还没跑完的任务，避免重复烧额度
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 主检查：格式 -> 静态分析 -> 构建 -> 竞态测试 + 覆盖率
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # 以 go.mod 声明的版本为准，顺带验证"Go 1.22+ 可用"这个承诺
          go-version-file: go.mod
          # 本项目零依赖、没有 go.sum，缓存没有收益
          cache: false

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未格式化，请在本地运行 gofmt -w ."
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -shuffle=on -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -n 1

  # 跨平台编译检查：readfile 里有 //go:build unix 的测试文件，平台差异值得盯住
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # linux 已由上面的 test job 覆盖，这里只补另外两个
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...
